name: Build pgModeler (Linux, Windows, macOS)
 
on:
  push:
    branches: [ develop, master, main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. LINUX
  # ==========================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libpq-dev \
            libxml2-dev \
            libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_dist" \
            -DPREFIX="${{ github.workspace }}/install_dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/install_dist"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-linux
          path: install_dist/

  # ==========================================
  # 2. WINDOWS (MinGW-w64 через MSYS2)
  # ==========================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-libxml2

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -u '${{ github.workspace }}')/install_dist" \
            -DPREFIX="$(cygpath -u '${{ github.workspace }}')/install_dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --prefix "$(cygpath -u '${{ github.workspace }}')/install_dist"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-windows
          path: install_dist/

  # ==========================================
  # 3. macOS
  # ==========================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ninja libpq libxml2

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'mac'
          target: 'desktop'

      - name: Configure CMake
        run: |
          # libpq в Homebrew keg-only, поэтому явно прописываем путь к нему
          LIBPQ_PREFIX=$(brew --prefix libpq)
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$LIBPQ_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install_dist" \
            -DPREFIX="${{ github.workspace }}/install_dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/install_dist"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-macos
          path: install_dist/
