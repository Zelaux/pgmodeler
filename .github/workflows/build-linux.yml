name: Build pgModeler (Linux)

on:
  push:
    branches: [ develop, master, main, build ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Системные зависимости для сборки
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libpq-dev \
            libxml2-dev \
            libgl-dev \
            libglx-dev \
            libopengl-dev \
            libegl-dev \
            libxkbcommon-dev

      # 2. Установка Qt 6.7.2 со стабильного зеркала
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          mirror: 'https://mirrors.dotsrc.org/qtproject'

      # 3. Сборка и установка по официальному руководству
      - name: Build and Install pgModeler
        run: |
          INSTALL_DIR="${{ github.workspace }}/install_dist"
          QT_ROOT=$(qtpaths --install-prefix)

          cmake -S . -B ./cmake-build -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPGM_PREFIX="$INSTALL_DIR" \
            --fresh

          cmake --build ./cmake-build --target all
          cmake --install ./cmake-build/

      # 4. Секция "Resolving dependencies": копирование Qt, плагинов и ВСЕХ системных библиотек
      - name: Bundle All Dependencies
        run: |
          INSTALL_DIR="${{ github.workspace }}/install_dist"
          QT_ROOT=$(qtpaths --install-prefix)

          # Конфигурация путей для Qt
          echo -e "[Paths]\nPrefix=.\nPlugins=lib/qtplugins\nLibraries=lib" > "$INSTALL_DIR/qt.conf"
          echo -e "[Paths]\nPrefix=..\nPlugins=lib/qtplugins\nLibraries=lib" > "$INSTALL_DIR/bin/qt.conf"

          # 4.1. Копируем библиотеки Qt
          cd "$QT_ROOT/lib"
          cp -P \
            libQt6DBus.so.6* \
            libQt6PrintSupport.so.6* \
            libQt6Widgets.so.6* \
            libQt6Network.so.6* \
            libQt6Gui.so.6* \
            libQt6Core.so.6* \
            libQt6XcbQpa.so.6* \
            libQt6Svg.so.6* \
            libicui18n.so.* \
            libicuuc.so.* \
            libicudata.so.* \
            "$INSTALL_DIR/lib/"

          # 4.2. Копируем плагины Qt
          cd "$QT_ROOT/plugins"
          mkdir -p "$INSTALL_DIR/lib/qtplugins/platforms"

          cp -r iconengines/ "$INSTALL_DIR/lib/qtplugins/"
          cp -r imageformats/ "$INSTALL_DIR/lib/qtplugins/"
          cp -r platforminputcontexts/ "$INSTALL_DIR/lib/qtplugins/"
          cp -r platforms/libqxcb.so platforms/libqoffscreen.so "$INSTALL_DIR/lib/qtplugins/platforms/"
          cp -r printsupport/ "$INSTALL_DIR/lib/qtplugins/"
          cp -r tls/ "$INSTALL_DIR/lib/qtplugins/"
          cp -r xcbglintegrations/ "$INSTALL_DIR/lib/qtplugins/"

          # 4.3. Автоматический рекурсивный сбор ВСЕХ зависимостей (libpq, libxml2, libssl, libcrypto и т.д.)
          EXCLUDE_REGEX="libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|ld-linux|libGL\.so|libGLX\.so|libOpenGL\.so|libEGL\.so|libdrm\.so|libgbm\.so"

          echo "=== Поиск и копирование всех зависимостей ==="
          for i in {1..5}; do
            FOUND_NEW=0
            while IFS= read -r file; do
              while IFS= read -r line; do
                soname=$(echo "$line" | awk '{print $1}')
                target=$(echo "$line" | awk '{print $3}')

                if echo "$soname" | grep -Eq "$EXCLUDE_REGEX"; then
                  continue
                fi

                if [ -f "$target" ] && [ ! -f "$INSTALL_DIR/lib/$soname" ]; then
                  cp -L "$target" "$INSTALL_DIR/lib/$soname"
                  FOUND_NEW=$((FOUND_NEW + 1))
                fi
              done < <(ldd "$file" 2>/dev/null | grep '=> /')
            done < <(find "$INSTALL_DIR/bin" "$INSTALL_DIR/lib" -type f \( -name "*.so*" -o -perm /111 \))

            echo "Проход $i: скопировано $FOUND_NEW новых зависимостей."
            if [ "$FOUND_NEW" -eq 0 ]; then
              break
            fi
          done

          # 4.4. Создаем скрипт запуска start.sh
          cat << 'EOF' > "$INSTALL_DIR/start.sh"
          #!/usr/bin/env bash
          APP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$APP_DIR/lib:$APP_DIR/lib/pgmodeler:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$APP_DIR/lib/qtplugins"
          exec "$APP_DIR/bin/pgmodeler" "$@"
          EOF
          chmod +x "$INSTALL_DIR/start.sh"

      # 5. Загрузка готового артефакта
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-linux
          path: install_dist/
