name: Build pgModeler (Windows)

on:
  push:
    branches: [ develop, master, main, build ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка окружения MSYS2 и пакетов по документации
      - name: Setup MSYS2 and Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: 'C:\msys64'
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools

      # 2. Гарантируем доступность C:\msys64\mingw64 для скриптов pgModeler
      - name: Ensure Compiler Path
        run: |
          mkdir -p /c/msys64
          if [ ! -d "/c/msys64/mingw64" ]; then
            cmd.exe //c "mklink /J C:\\msys64\\mingw64 $(cygpath -w /mingw64)" || true
          fi
          # Проверяем наличие clang++
          which clang++
          /c/msys64/mingw64/bin/clang++ --version

      # 3. Сборка и установка по официальному гайду
      - name: Build and Install pgModeler
        run: |
          INSTALL_DIR="$(cygpath -m '${{ github.workspace }}')/install_dist"

          cmake -S . -B ./cmak
