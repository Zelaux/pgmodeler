name: Build pgModeler (Windows)

on:
  push:
    branches: [ develop, master, main, build ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка окружения MSYS2 и пакетов по документации
      - name: Setup MSYS2 and Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools

      # 2. Связываем жестко зашитый путь C:\msys64\mingw64 с реальным расположением MSYS2
      - name: Link C:\msys64 to active MinGW64
        run: |
          # Удаляем пустую/старую папку mingw64 на диске C
          cmd.exe //c "rmdir /S /Q C:\\msys64\\mingw64 2>nul" || true
          cmd.exe //c "mkdir C:\\msys64 2>nul" || true
          
          # Создаем Junction на реальный каталог /mingw64 (на диске D)
          cmd.exe //c "mklink /J C:\\msys64\\mingw64 $(cygpath -w /mingw64)"
          
          # Проверяем, что зашитый путь C:/msys64/mingw64/bin/clang++.exe теперь работает
          /c/msys64/mingw64/bin/clang++.exe --version

      # 3. Сборка и установка по официальному гайду
      - name: Build and Install pgModeler
        run: |
          INSTALL_DIR="$(cygpath -m '${{ github.workspace }}')/install_dist"

          cmake -S . -B ./cmake-build -G Ninja \
            -DCMAKE_PREFIX_PATH="/mingw64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPGM_PREFIX="$INSTALL_DIR" \
            --fresh

          cmake --build ./cmake-build --target all
          cmake --install ./cmake-build/

      # 4. Деплой зависимостей (windeployqt, DLL и плагины)
      - name: Bundle Windows Dependencies
        run: |
          INSTALL_DIR="$(cygpath -u '${{ github.workspace }}')/install_dist"
          cd "$INSTALL_DIR"

          # 4.1. Запуск windeployqt по документации (для развертывания рантайма Qt)
          DEPLOY_BIN=$(command -v windeployqt-qt6 || command -v windeployqt)
          "$DEPLOY_BIN" pgmodeler.exe $(find . -maxdepth 2 -name "*gui*.dll") --compiler-runtime || true

          # 4.2. Создание qt.conf по официальной документации
          echo -e "[Paths]\nPrefix=.\nPlugins=qtplugins\nLibraries=." > qt.conf

          # 4.3. Копирование обязательных DLL из документации
          cd /mingw64/bin
          cp -P \
            D3Dcompiler_47.dll libb2-1.dll libbrotlicommon.dll libbrotlidec.dll libbz2-1.dll libcrypto-3-x64.dll \
            libdouble-conversion.dll libfreetype-6.dll libgcc_s_seh-1.dll libglib-2.0-0.dll libgraphite2.dll \
            libharfbuzz-0.dll libiconv-2.dll libicudt*.dll libicuin*.dll libicuuc*.dll libintl-8.dll liblzma-5.dll \
            libmd4c.dll libpcre2-8-0.dll libpcre2-16-0.dll libpng16-16.dll libpq.dll libssl-3-x64.dll libstdc++-6.dll \
            libwinpthread-1.dll libxml2-2.dll libzstd.dll zlib1.dll \
            "$INSTALL_DIR/" 2>/dev/null || true

          # 4.4. Копирование TLS-плагинов
          mkdir -p "$INSTALL_DIR/qtplugins/tls"
          cp -r /mingw64/share/qt6/plugins/tls/* "$INSTALL_DIR/qtplugins/tls/" 2>/dev/null || true

          # 4.5. Автоматический сбор любых других транзитивных DLL
          echo "=== Поиск и докопирование оставшихся зависимостей ==="
          for i in {1..3}; do
            for pe in $(find "$INSTALL_DIR" -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dll" \)); do
              for dll in $(ldd "$pe" 2>/dev/null | grep -i '/mingw64/bin/' | awk '{print $3}'); do
                dll_name=$(basename "$dll")
                if [ ! -f "$INSTALL_DIR/$dll_name" ] && [ -f "$dll" ]; then
                  cp -L "$dll" "$INSTALL_DIR/"
                fi
              done
            done
          done

      # 5. Загрузка собранного архива
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgmodeler-windows
          path: install_dist/
